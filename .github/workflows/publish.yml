name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Gebaut wird aus pyproject.toml, nicht aus dem Tag. Stimmen die beiden
      # nicht ueberein, entstuende ein Paket mit der alten Nummer: PyPI lehnt
      # es als Duplikat ab, und die MCP-Registry bekaeme eine Version, die es
      # auf PyPI nicht gibt. Der Abbruch steht vor dem Build, damit der Grund
      # in der Absage steht und nicht in einem PyPI-Fehler ganz am Ende.
      - name: Verify the tag matches the committed version
        run: python scripts/check_version_sync.py --expect "$GITHUB_REF_NAME"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/swiss-transport-mcp/
    permissions:
      id-token: write   # Pflicht fuer Trusted Publisher (OIDC)

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-mcp:
    name: Publish to MCP Registry
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for MCP Registry Trusted Publishing (OIDC)
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Hier stand ein `jq`-Schritt, der `server.json` aus dem Tag-Namen
      # ueberschrieb. Er war der Grund, warum eine veraltete committete Version
      # nie auffiel: Das publizierte Manifest war immer richtig, die Datei im
      # Repo durfte falsch bleiben — waehrend der PyPI-Build daneben genau
      # diese Datei las. Jetzt wird geprueft statt geflickt; `server.json` ist
      # bereits korrekt, weil `check_version_sync.py` es gegen
      # `pyproject.toml` haelt und dieses gegen den Tag.
      - name: Verify the tag matches the committed version
        run: python scripts/check_version_sync.py --expect "$GITHUB_REF_NAME"

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
